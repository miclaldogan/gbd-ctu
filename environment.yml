name: gbd-ctu
channels:
  - pytorch
  - pyg
  - conda-forge
  - defaults

dependencies:
  - python=3.13
  - pip

  # Core scientific stack
  - numpy=2.4.4
  - pandas=3.0.3
  - scikit-learn=1.8.0
  - scipy=1.17.1
  - networkx=3.6.1
  - matplotlib=3.10.9
  - seaborn=0.13.2
  - tqdm=4.67.3
  - pyyaml=6.0.3
  - joblib=1.5.3

  # PyTorch (CPU build; swap pytorch-cuda=<version> for GPU)
  - pytorch=2.12.0
  - cpuonly

  # Testing / dev tooling
  - pytest=9.0.3
  - pytest-cov=7.1.0

  - pip:
      - wandb==0.27.0
      # Install torch-geometric after activating the env:
      #   pip install torch-geometric torch-scatter torch-sparse \
      #       -f https://data.pyg.org/whl/torch-2.12.0+cpu.html
